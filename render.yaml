databases:
  - name: dashboard-db
    plan: free
    databaseName: dashboard_production
    user: dashboard

services:
  - type: web
    name: dashboard
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /up
    dockerCommand: ./bin/render-start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dashboard-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: PORT
        value: "10000"
